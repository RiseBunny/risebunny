<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 — RiseBunny</title>
<link rel="icon" type="image/svg+xml" href="images/bot.svg">
<link rel="alternate icon" type="image/png" href="images/bot.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#0b0b12;
    --card:#13131c;
    --card-2:#1a1a26;
    --line:rgba(255,255,255,0.06);
    --text:#e8e8f0;
    --muted:#8a8aa6;
    --accent:#9b6dff;
    --accent-2:#7aa2ff;
    --radius:18px;
    --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(900px 500px at 12% 0%, rgba(155,109,255,0.10), transparent 60%),
      radial-gradient(800px 500px at 95% 100%, rgba(122,162,255,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align:center;
    padding: 24px;
    overflow:auto;
  }
  .card{
    width: min(640px, 100%);
    background: linear-gradient(180deg, rgba(20,20,34,0.75), rgba(10,10,16,0.9));
    border:1px solid var(--line);
    border-radius: 26px;
    padding: 48px 32px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(2px);
    animation: rise 0.6s ease-out;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
  }
  .code{
    font-size: clamp(80px, 18vw, 160px);
    font-weight: 800;
    letter-spacing: -0.08em;
    line-height: 1;
    background: linear-gradient(120deg, #ffffff 30%, #a9a2ce 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  h1{
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .sub{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-top: 8px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 22px;
    border-radius: 40px;
    font-weight: 600;
    font-size: 14px;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.12);
    background: var(--card);
    color: var(--text);
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn:hover{
    background: #1f1f2e;
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }
  .btn.primary{
    background: linear-gradient(135deg, #5b3cc4, #3a2a6b);
    border-color: transparent;
    color: #fff;
  }
  .btn.primary:hover{
    filter: brightness(1.1);
  }
  .hint{
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }
  .hint code{
    background: rgba(255,255,255,0.06);
    padding: 2px 8px;
    border-radius: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .footer{
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  @media (max-width: 480px){
    .card{padding: 32px 20px}
    .code{font-size: 64px}
  }
</style>
</head>
<body>

<main class="card" role="main">
  <div class="code">404</div>
  <h1>Sayfa bulunamadı</h1>
  <p class="sub">
    Aradığın sayfayı bulamadık. Bağlantıyı kontrol edip tekrar dene.
  </p>

  <div class="actions">
    <a class="btn primary" href="/index.html"><i class="fa-solid fa-house"></i> Anasayfa</a>
    <a class="btn" href="/risebunny.html"><i class="fa-solid fa-robot"></i> Bot Dünyası</a>
  </div>

  <p class="hint">
    İhtiyacın olanı bulamadıysan anasayfaya dönüp menüden devam edebilirsin.
  </p>

  <footer class="footer">
    © 2026 RiseBunny. Tüm hakları saklıdır. <br>
    Rise Beyond Limits.
  </footer>
</main>

</body>
</html>
